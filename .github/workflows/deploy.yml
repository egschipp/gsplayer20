name: Deploy
run-name: >-
  ${{
    github.event_name == 'pull_request' && format('Validate PR #{0}', github.event.pull_request.number) ||
    github.event_name == 'workflow_dispatch' && format('Deploy main manually by {0}', github.actor) ||
    format('Deploy main at {0}', github.sha)
  }}

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "lib/**"
      - "pages/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "types/**"
      - "infra/**"
      - "Dockerfile"
      - ".dockerignore"
      - "worker.js"
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "proxy.ts"
      - "playwright.config.ts"
      - "eslint.config.js"
      - "tsconfig.json"
      - "tsconfig.test.json"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "db/**"
      - "lib/**"
      - "pages/**"
      - "public/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "types/**"
      - "infra/**"
      - "Dockerfile"
      - ".dockerignore"
      - "worker.js"
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "proxy.ts"
      - "playwright.config.ts"
      - "eslint.config.js"
      - "tsconfig.json"
      - "tsconfig.test.json"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Validate Web App
    if: github.actor != 'release-please[bot]' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Install browser for accessibility tests
        run: npx playwright install --with-deps chromium

      - name: Browser and WCAG tests
        run: npm run test:e2e

      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build And Scan Container
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build candidate (arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Promote scanned image to latest
        run: >-
          docker buildx imagetools create
          --tag "${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}:latest"
          "${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}"

  deploy:
    name: Deploy To ARM Runner
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Resolve app version
        id: app_version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");

          async function main() {
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fallbackVersion = String(pkg.version || "0.0.0").replace(/^v/i, "").trim();
            const repo = String(process.env.GITHUB_REPOSITORY || "").trim();
            const token = String(process.env.GITHUB_TOKEN || "").trim();

            if (!repo || !token) {
              process.stdout.write(`value=${fallbackVersion}\n`);
              return;
            }

            try {
              const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
                headers: {
                  Accept: "application/vnd.github+json",
                  Authorization: `Bearer ${token}`,
                  "User-Agent": "gsplayer20-deploy-version",
                },
                cache: "no-store",
              });

              if (!res.ok) {
                process.stdout.write(`value=${fallbackVersion}\n`);
                return;
              }

              const data = await res.json();
              const tag = String(data?.tag_name || "")
                .trim()
                .replace(/^v/i, "");
              if (tag) {
                process.stdout.write(`value=${tag}\n`);
                return;
              }
            } catch {
              // fall back to package.json version
            }

            process.stdout.write(`value=${fallbackVersion}\n`);
          }

          main();
          NODE

      - name: Validate TOKEN_ENCRYPTION_KEY
        env:
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TOKEN_ENCRYPTION_KEYS: ${{ secrets.TOKEN_ENCRYPTION_KEYS }}
          TOKEN_ENCRYPTION_KEY_VERSION: ${{ secrets.TOKEN_ENCRYPTION_KEY_VERSION }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import sys

          key = os.environ.get("TOKEN_ENCRYPTION_KEY", "")
          try:
            raw = base64.b64decode(key, validate=True)
          except Exception:
            print("TOKEN_ENCRYPTION_KEY is not valid base64", file=sys.stderr)
            sys.exit(1)

          if len(raw) != 32:
            print("TOKEN_ENCRYPTION_KEY must decode to 32 bytes", file=sys.stderr)
            sys.exit(1)
          PY

      - name: Deploy on self-hosted runner
        env:
          IMAGE_NAME: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.NEXTAUTH_SECRET }}
          APP_PIN: ${{ secrets.APP_PIN }}
          AUTH_URL: ${{ secrets.AUTH_URL || secrets.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.AUTH_SECRET || secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || secrets.AUTH_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TOKEN_ENCRYPTION_KEYS: ${{ secrets.TOKEN_ENCRYPTION_KEYS }}
          TOKEN_ENCRYPTION_KEY_VERSION: ${{ secrets.TOKEN_ENCRYPTION_KEY_VERSION }}
          ADMIN_SPOTIFY_USER_IDS: ${{ secrets.ADMIN_SPOTIFY_USER_IDS }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DB_PATH: /data/gsplayer.sqlite
          APP_RELEASE_VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"
          if [ -n "${DOCKER_PASSWORD:-}" ]; then
            echo "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
          fi
          if [ -z "${IMAGE_NAME:-}" ] || [ -z "${IMAGE_TAG:-}" ]; then
            echo "IMAGE_NAME/IMAGE_TAG ontbreekt" >&2
            exit 1
          fi
          if ! command -v flock >/dev/null 2>&1; then
            echo "flock ontbreekt op target host" >&2
            exit 1
          fi
          exec 9>.deploy.lock
          flock -n 9 || { echo "Deploy al bezig"; exit 1; }
          tmp_env="$(mktemp .env.tmp.XXXXXX)"
          cat > "$tmp_env" <<EOF
          APP_ENV=production
          IMAGE_NAME=$IMAGE_NAME
          IMAGE_TAG=$IMAGE_TAG
          SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID
          SPOTIFY_CLIENT_SECRET=$SPOTIFY_CLIENT_SECRET
          SPOTIFY_REDIRECT_URI=$SPOTIFY_REDIRECT_URI
          AUTH_SECRET=$AUTH_SECRET
          APP_PIN=$APP_PIN
          AUTH_URL=$AUTH_URL
          NEXTAUTH_SECRET=$NEXTAUTH_SECRET
          NEXTAUTH_URL=$NEXTAUTH_URL
          TOKEN_ENCRYPTION_KEY=$TOKEN_ENCRYPTION_KEY
          TOKEN_ENCRYPTION_KEYS=$TOKEN_ENCRYPTION_KEYS
          TOKEN_ENCRYPTION_KEY_VERSION=${TOKEN_ENCRYPTION_KEY_VERSION:-1}
          ADMIN_SPOTIFY_USER_IDS=$ADMIN_SPOTIFY_USER_IDS
          TRUST_PROXY=true
          SPOTIFY_IMAGE_MAX_BYTES=5242880
          APP_UID=$(id -u)
          APP_GID=$(id -g)
          DB_PATH=$DB_PATH
          APP_RELEASE_VERSION=$APP_RELEASE_VERSION
          EOF
          chmod 600 "$tmp_env"
          mv "$tmp_env" .env
          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose v2 not available" >&2
            exit 1
          fi
          COMPOSE_FILE_PATH="docker-compose.ci.yml"
          cat > "${COMPOSE_FILE_PATH}" <<'YAML'
          services:
            web:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
              container_name: gsplayer20
              env_file:
                - .env
              user: "${APP_UID}:${APP_GID}"
              init: true
              read_only: true
              cap_drop: ["ALL"]
              security_opt:
                - no-new-privileges:true
              tmpfs:
                - /tmp:rw,noexec,nosuid,size=64m
              ports:
                - "127.0.0.1:3000:3000"
              volumes:
                - ./data:/data
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
                start_period: 120s
                interval: 10s
                timeout: 5s
                retries: 12
              networks:
                - web

            worker:
              image: ${IMAGE_NAME}:${IMAGE_TAG}
              container_name: gsplayer20-worker
              command: ["node", "worker.js"]
              env_file:
                - .env
              user: "${APP_UID}:${APP_GID}"
              init: true
              read_only: true
              cap_drop: ["ALL"]
              security_opt:
                - no-new-privileges:true
              tmpfs:
                - /tmp:rw,noexec,nosuid,size=64m
              depends_on:
                web:
                  condition: service_healthy
              volumes:
                - ./data:/data
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"
              restart: unless-stopped
              networks:
                - web

          networks:
            web:
              external: true
          YAML
          docker network inspect web >/dev/null 2>&1 || docker network create web
          echo "Compose file: ${COMPOSE_FILE_PATH}"
          docker compose -f "${COMPOSE_FILE_PATH}" config | grep -E "image:" || true
          docker compose -f "${COMPOSE_FILE_PATH}" pull web worker
          if ! docker compose -f "${COMPOSE_FILE_PATH}" up -d --remove-orphans --wait --wait-timeout 180; then
            docker compose -f "${COMPOSE_FILE_PATH}" ps
            docker compose -f "${COMPOSE_FILE_PATH}" logs --no-color --tail=160 web worker || true
            exit 1
          fi
