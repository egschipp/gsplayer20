services:
  web:
    image: ${IMAGE_NAME:-ghcr.io/egschipp/gsplayer20}:${IMAGE_TAG:-latest}
    container_name: gsplayer20
    env_file:
      - .env
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      start_period: 120s
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - web

  worker:
    image: ${IMAGE_NAME:-ghcr.io/egschipp/gsplayer20}:${IMAGE_TAG:-latest}
    container_name: gsplayer20-worker
    command: ["node", "worker.js"]
    env_file:
      - .env
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    init: true
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true
